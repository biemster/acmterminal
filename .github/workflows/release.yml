name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create environment configuration
        run: touch .env

      - name: Setup debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            echo "debug.keystore not found. Generating default Android debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -deststoretype pkcs12
          fi
          ls -la debug.keystore

      - name: Setup release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from KEYSTORE_BASE64 secret..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          elif [ -f my-upload-key.jks.base64 ]; then
            echo "Decoding release keystore from my-upload-key.jks.base64..."
            base64 -d my-upload-key.jks.base64 > my-upload-key.jks
          fi

          if [ ! -f my-upload-key.jks ]; then
            echo "No custom release keystore provided. Creating fallback keystore so release build succeeds..."
            keytool -genkeypair \
              -alias upload \
              -keypass android \
              -keystore my-upload-key.jks \
              -storepass android \
              -dname "CN=Android Release,O=ACMterminal,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -deststoretype pkcs12
          fi
          # Copy to app directory as well in case gradle resolves relative to project or module
          cp my-upload-key.jks app/my-upload-key.jks
          ls -la my-upload-key.jks app/my-upload-key.jks

      - name: Build Release APK
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: gradle assembleRelease -PversionName=${{ github.ref_name }} --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          TAG_NAME="${{ github.ref_name }}"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-artifacts/acm-terminal-${TAG_NAME}.apk"
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "release-artifacts/acm-terminal-${TAG_NAME}-debug.apk"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
